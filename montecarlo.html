<header class="hero"><div><div class="eyebrow" id="eyebrow">Individual learning activity · Decision-making lab</div><h1 id="heroTitle">Monte Carlo: From uncertainty<br>to a business decision.</h1><p id="heroLead"></p></div><div class="hero-figure"><b>60 min</b><span id="guidedSteps">8 guided steps</span><span id="months">10,000 simulated months</span></div></header>

</aside><main class="content" id="mainContent"><article class="panel mainpanel"><div class="headerline"><span class="stepbadge" id="stepBadge"></span><span class="minutes" id="timeLabel"></span></div><h2 id="stageTitle"></h2><p class="lead" id="stageLead"></p><div id="stageBody"></div><div class="actions"><button type="button" class="btn" id="prevBtn"></button><span class="smallprint" id="positionText"></span><div class="next"><button type="button" class="btn primary" id="nextBtn"></button></div></div></article><div class="footer-note" id="footerNote"></div></main></div></div>
<footer class="author-credit" id="authorCredit" style="max-width:1290px;padding:16px 24px"><span><strong id="authorCaption">Simulator author</strong>: Dr. Boris C. Herbas Torrico</span><a href="mailto:boris.herbas@tec.mx">boris.herbas@tec.mx</a></footer><script>
'use strict';
const $=id=>document.getElementById(id);
const ORIGINAL_STAGES=[
 {title:'Base case',time:'0–6 min',lead:'Begin with the deterministic business model. What does one expected-profit number tell us—and what does it hide?'},
 {title:'Model uncertainty',time:'6–13 min',lead:'Identify the uncertain inputs, their probability distributions, and the model assumptions.'},
 {title:'Simulate 10,000 futures',time:'13–21 min',lead:'Generate reproducible random combinations and calculate monthly profit for every simulated future.'},
 {title:'Measure profit and risk',time:'21–32 min',lead:'Interpret expected performance, downside outcomes, percentiles, and probability of hitting the profit target.'},
 {title:'Analyze sensitivity',time:'32–40 min',lead:'Find which uncertain inputs are most strongly associated with simulated monthly profit.'},
 {title:'Compare supplier strategies',time:'40–49 min',lead:'Compare the current supplier with a stable supplier using the same simulated market conditions.'},
 {title:'Check convergence',time:'49–54 min',lead:'Compare results based on 100, 1,000, and 10,000 iterations to assess Monte Carlo sampling stability.'},
 {title:'Decide & prepare your report',time:'54–60 min',lead:'Write a defensible recommendation, acknowledge a limitation, and export the evidence-based report for your learning platform.'}
];
const A={mu:3.458,sigma:0.1245,fix:120000};
const B={mu:3.399,sigma:0.0666,fix:140000};
const RUNS=10000, TARGET=100000;
let active=0,sim=null,dirty=false,seed=2026,lang='en',wasRun=false;
let answers={name:'',studentID:'',group:'',firstDecision:'',firstWhy:'',risk:'',sensitivity:'',choice:'',evidence:'',limitations:''};
const number=x=>Number(x).toLocaleString(lang==='es'?'es-MX':'en-US',{maximumFractionDigits:0});
const money=x=>'$'+number(Math.round(x));
const pct=x=>(100*x).toLocaleString(lang==='es'?'es-MX':'en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const decimal=x=>Number(x).toLocaleString(lang==='es'?'es-MX':'en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const safe=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function normal01(rand){let u=0,v=0;while(u===0)u=rand();while(v===0)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function triangle(rand,a,m,b){let u=rand(),c=(m-a)/(b-a);return u<c?a+Math.sqrt(u*(b-a)*(m-a)):b-Math.sqrt((1-u)*(b-a)*(b-m))}
function summarize(rows,key,n=rows.length){let vals=rows.slice(0,n).map(r=>r[key]);let sorted=vals.slice().sort((a,b)=>a-b);let s=0,ss=0,loss=0,hit=0;for(const x of vals){s+=x;ss+=x*x;if(x<0)loss++;if(x>=TARGET)hit++}const mean=s/n,variance=Math.max(0,ss/n-mean*mean);return{n,mean,sd:Math.sqrt(variance),median:quant(sorted,.5),p10:quant(sorted,.10),p90:quant(sorted,.90),min:sorted[0],max:sorted[n-1],loss:loss/n,target:hit/n}}
function quant(sorted,p){let pos=(sorted.length-1)*p,i=Math.floor(pos);return sorted[i]+(sorted[Math.min(i+1,sorted.length-1)]-sorted[i])*(pos-i)}
function ranks(arr){const indexed=arr.map((v,i)=>({v,i}));indexed.sort((a,b)=>a.v-b.v);const rank=new Float64Array(arr.length);for(let i=0;i<indexed.length;){let j=i+1;while(j<indexed.length&&indexed[j].v===indexed[i].v)j++;let v=(i+j+1)/2;for(let k=i;k<j;k++)rank[indexed[k].i]=v;i=j}return rank}
function spear(x,y){let a=ranks(x),b=ranks(y),n=x.length,ma=(n+1)/2,mb=(n+1)/2,xy=0,xx=0,yy=0;for(let i=0;i<n;i++){let u=a[i]-ma,v=b[i]-mb;xy+=u*v;xx+=u*u;yy+=v*v}return xy/Math.sqrt(xx*yy)}
function simulate(seed){const rand=mulberry32(seed),rows=[];for(let i=0;i<RUNS;i++){const d=triangle(rand,8000,10000,14000),price=50+3*normal01(rand),costA=Math.exp(A.mu+A.sigma*normal01(rand)),costB=Math.exp(B.mu+B.sigma*normal01(rand));rows.push({d,price,costA,costB,profitA:(price-costA)*d-A.fix,profitB:(price-costB)*d-B.fix})}
 const sA=summarize(rows,'profitA'),sB=summarize(rows,'profitB');const rho=[{name:'Demand',key:'d',r:spear(rows.map(x=>x.d),rows.map(x=>x.profitA))},{name:'Selling price',key:'price',r:spear(rows.map(x=>x.price),rows.map(x=>x.profitA))},{name:'Variable cost',key:'costA',r:spear(rows.map(x=>x.costA),rows.map(x=>x.profitA))}].sort((x,y)=>Math.abs(y.r)-Math.abs(x.r));let better=0;for(const r of rows)if(r.profitB>r.profitA)better++;
 return{seed,rows,A:sA,B:sB,rho,win:better/RUNS,convergence:[100,1000,10000].map(n=>({n,A:summarize(rows,'profitA',n),B:summarize(rows,'profitB',n)}))}}

function restore(){
 try {const raw=localStorage.getItem('portable-mc-decision-lab-2026-v2');

   if(Number.isInteger(x.seed)&&x.seed>=1&&x.seed<=4294967295)seed=x.seed;
   if(Number.isInteger(x.active)&&x.active>=0&&x.active<8)active=x.active;
   if(x.lang==='es'||x.lang==='en')lang=x.lang;
   else lang=(navigator.language||'en').toLowerCase().startsWith('es')?'es':'en';
   if(x.wasRun===true){wasRun=true;sim=simulate(seed)}}
  else lang=(navigator.language||'en').toLowerCase().startsWith('es')?'es':'en';
 }catch(e){lang=(navigator.language||'en').toLowerCase().startsWith('es')?'es':'en'}

function shortMoney(x){const n=Math.round(x/1000);return n<0?'−$'+Math.abs(n)+'k':'$'+n+'k'}
function makeHist(mode){
 const t=T().hist,rows=sim.rows,a=rows.map(x=>x.profitA),b=mode==='both'?rows.map(x=>x.profitB):[];
 const mn=Math.min(...a,...b),mx=Math.max(...a,...b),bins=30,dx=(mx-mn)/bins;
 const ca=Array(bins).fill(0),cb=Array(bins).fill(0);
 for(const x of a)ca[Math.max(0,Math.min(bins-1,Math.floor((x-mn)/dx)))]++;
 for(const x of b)cb[Math.max(0,Math.min(bins-1,Math.floor((x-mn)/dx)))]++;
 const top=Math.max(...ca,...cb)/RUNS*100*1.12,X=72,Y=245,W=800,H=210,bw=W/bins;
 const parts=[];
 for(let k=0;k<=4;k++){const v=top*k/4,y=Y-H*k/4;parts.push(`<line x1="${X}" x2="${X+W}" y1="${y}" y2="${y}" stroke="#e0e9e9"/><text x="${X-10}" y="${y+4}" font-size="11" text-anchor="end" fill="#607782">${v.toFixed(1)}%</text>`)}
 for(let i=0;i<bins;i++){const ha=H*(ca[i]/RUNS*100/top),hb=H*(cb[i]/RUNS*100/top);
  if(mode==='both')parts.push(`<rect x="${X+i*bw+1}" y="${Y-ha}" width="${(bw-2)/2}" height="${ha}" fill="#087d86"/><rect x="${X+i*bw+1+(bw-2)/2}" y="${Y-hb}" width="${(bw-2)/2}" height="${hb}" fill="#e6a14a"/>`);
  else parts.push(`<rect x="${X+i*bw+1}" y="${Y-ha}" width="${bw-2}" height="${ha}" fill="#087d86"/>`)}
 for(let k=0;k<=4;k++){const val=mn+(mx-mn)*k/4,x=X+W*k/4;parts.push(`<text x="${x}" y="${Y+25}" font-size="11" text-anchor="middle" fill="#5a7380">${shortMoney(val)}</text>`)}
 for(const [val,label,color] of [[0,t.breakEven,'#b54f46'],[100000,t.target,'#a77817']])if(val>mn&&val<mx){const x=X+(val-mn)/(mx-mn)*W;parts.push(`<line x1="${x}" x2="${x}" y1="26" y2="${Y}" stroke="${color}" stroke-width="2" stroke-dasharray="5 4"/><text x="${Math.max(75,Math.min(765,x+4))}" y="19" font-size="10" fill="${color}">${label}</text>`)}
 return `<div class="chart-area"><div class="legend"><span><span class="swatch" style="background:#087d86"></span>${t.a}</span>${mode==='both'?`<span><span class="swatch" style="background:#e6a14a"></span>${t.b}</span>`:''}<span>${t.bars}</span></div><svg viewBox="0 0 925 300" role="img" aria-label="${mode==='both'?t.ariaBoth:t.ariaA}"><text x="73" y="14" font-size="11" fill="#607782">${t.y}</text>${parts.join('')}<text x="473" y="296" font-size="12" text-anchor="middle" fill="#4f6e77">${t.x}</text></svg></div>`
}

function step7(){const t=T().p7;
 return `<div class="section-kicker">${T().w[7]}</div>${callout(t.introLabel,t.intro)}<div class="prompt entry"><h3>${t.heading}</h3><label for="choice">${t.choiceLabel}</label><select id="choice">${optionList(t.choices||T().choices,optChoice,answers.choice)}</select><label for="evidence">${t.evidence}</label><textarea id="evidence" rows="4" placeholder="${safe(t.evidencePh)}">${safe(answers.evidence)}</textarea><label for="limitations">${t.limits}</label><textarea id="limitations" rows="3" placeholder="${safe(t.limitsPh)}">${safe(answers.limitations)}</textarea></div><h3>${t.report}</h3><div id="reportAlert" class="report-alert" aria-live="polite"></div><textarea id="reportText" class="reportbox" readonly aria-label="${t.reportAria}">${safe(reportText())}</textarea><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn primary" id="copyReport">${t.copy}</button><button type="button" class="btn" id="downloadReport">${t.download}</button></div><p id="copyStatus" class="running-status" role="status">${t.copyNote}</p><p class="smallprint">${t.reportNote}</p>`}
const stepFuncs=[step0,step1,step2,step3,step4,step5,step6,step7];
function bindAnswer(id,key=id){const e=$(id);if(!e)return;e.addEventListener(e.tagName==='SELECT'?'change':'input',()=>{answers[key]=e.value;save();if(active===7){$('reportText').value=reportText();updateCompletion()}})}
function updateCompletion(){const miss=required.filter(k=>!(answers[k]||'').trim());const e=$('reportAlert');if(e){const complete=sim&&!dirty&&miss.length===0;e.className='report-alert '+(complete?'complete':'incomplete');e.textContent=complete?T().p7.complete:tx(T().p7.incomplete,{n:miss.length})}}
function render(){if($('authorCaption'))$('authorCaption').textContent=lang==='es'?'Autor del simulador':'Simulator author';translateShell();buildNav();const t=T();const s=t.stages[active];
 $('stepBadge').textContent=`${t.step} ${String(active+1).padStart(2,'0')} / 08`;
 $('timeLabel').textContent=s[1];$('stageTitle').textContent=s[0];$('stageLead').textContent=s[2];$('stageBody').innerHTML=stepFuncs[active]();
 $('positionText').textContent=tx(t.position,{n:active+1});$('prevBtn').disabled=active===0;$('nextBtn').textContent=active===7?t.done:t.next;$('nextBtn').disabled=active===7;
 status();if(active===0){bindAnswer('firstDecision');bindAnswer('firstWhy')}if(active===3)bindAnswer('risk');if(active===4)bindAnswer('sensitivity');
 if(active===7){bindAnswer('choice');bindAnswer('evidence');bindAnswer('limitations');updateCompletion();$('copyReport').addEventListener('click',copyReport);$('downloadReport').addEventListener('click',()=>download('Monte_Carlo_Report_'+lang.toUpperCase()+'.txt',reportText()))}
 if(active===2){$('runSim').addEventListener('click',run);$('resetSeed').addEventListener('click',()=>{seed=2026;sim=null;wasRun=false;dirty=false;save();render()});
  $('seedInput').addEventListener('input',()=>{const n=Number($('seedInput').value);if(Number.isInteger(n)&&n>=1&&n<=4294967295){seed=n;sim=null;dirty=true;wasRun=false;save();$('runStatus').textContent=t.seedChanged;status()}})}
}
function run(){const n=Number($('seedInput').value);if(!Number.isSafeInteger(n)||n<1||n>4294967295){$('runStatus').textContent=T().seedInvalid;return}
 seed=n;const languageAtStart=lang;$('runStatus').textContent=T().calculating;$('runSim').disabled=true;
 setTimeout(()=>{try{sim=simulate(seed);dirty=false;wasRun=true;save();render();$('runStatus').textContent=tx(T().success,{seed});}catch(e){$('runStatus').textContent=T().simError;$('runSim').disabled=false;console.error(e)}},30)
}
async function copyReport(){const missing=required.filter(k=>!(answers[k]||'').trim());if(!sim||dirty||missing.length){$('copyStatus').textContent=T().copyIncomplete;return}
 const report=reportText(),ta=$('reportText');ta.value=report;let ok=false;
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(report);ok=true}}catch(e){}
 if(!ok){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(e){}}
 $('copyStatus').textContent=ok?T().copySuccess:T().copyFallback;
}
function download(name,content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function reset(){if(!confirm(T().resetConfirm))return;for(const k in answers)answers[k]='';for(const [field,key] of [['studentName','name'],['studentID','studentID'],['studentGroup','group']])$(field).value='';sim=null;dirty=false;wasRun=false;seed=2026;active=0;save();render()}
restore();
for(const [id,key] of [['studentName','name'],['studentID','studentID'],['studentGroup','group']]){$(id).value=answers[key];$(id).addEventListener('input',()=>{answers[key]=$(id).value;save();if(active===7){$('reportText').value=reportText();updateCompletion()}})}
$('chooseEs').onclick=()=>language('es');$('chooseEn').onclick=()=>language('en');
$('prevBtn').onclick=()=>go(active-1);$('nextBtn').onclick=()=>go(active+1);$('resetActivity').onclick=reset;
render();

</script>
</body></html>
