 {en:'Manufacturing performance',es:'Desempeño de manufactura',briefEn:'A production facility is choosing which improvement project to authorize first. All 20 candidates have passed mandatory requirements. Benefits and implementation resources compete.',briefEs:'Una planta debe elegir qué proyecto de mejora autorizar primero. Los 20 candidatos cumplen requisitos obligatorios. Beneficios y recursos compiten.',titlesEn:['Line balancing','Quick-change tooling','Preventive maintenance','Automation cell','Workstation redesign','Operator cross-training','Material flow redesign','Visual management','Machine condition sensors','Production scheduling','Setup standardization','Ergonomic fixtures','Work instruction redesign','In-line inspection','Tooling reliability','Micro-stop reduction','Capacity leveling','Digital performance board','Poka-yoke upgrade','Bottleneck improvement'],titlesEs:['Balanceo de línea','Herramental de cambio rápido','Mantenimiento preventivo','Celda automatizada','Rediseño de estación','Capacitación cruzada','Rediseño de flujo','Gestión visual','Sensores de condición','Programación de producción','Estandarización de setup','Dispositivos ergonómicos','Instrucciones de trabajo','Inspección en línea','Confiabilidad de herramental','Reducción de microparos','Nivelación de capacidad','Tablero digital','Mejora poka-yoke','Mejora de cuello de botella']},

function createScenario(code){const c=normalizeCode(code);if(!c)throw Error('Scenario code must be IE-001 to IE-999.');const no=Number(c.slice(3));const type=(no-1)%3,context=CASES[type],seed=hash('IDL-v2-data-'+c);let projects=[];for(let attempt=0;attempt<8;attempt++){

 puntuaciones normalizadas son preferencias relativas, no mejoras ni probabilidades. Un mayor valor normalizado indica mejor desempeño.')+'</div><div class="actions">'+button('check-norm',L('Check the four calculations','Revisar los cuatro cálculos'))+(done?'<span class="pill ok">'+L('Verified','Verificado')+'</span>':'')+'</div>'+(done?'<div class="grid three"><div class="kpi"><div class="caption">'+L('Productivity contribution','Contribución productividad')+'</div><div class="value">'+f(nprod*wp,5)+'</div></div><div class="kpi"><div class="caption">'+L('Duration contribution','Contribución duración')+'</div><div class="value">'+f(nd*wd,5)+'</div></div><div class="kpi"><div class="caption">'+L('Subtotal (2 of 8 criteria)','Subtotal (2 de 8 criterios')+'</div><div class="value">'+f(nprod*wp+nd*wd,5)+'</div></div></div>':'')+(S.attempts.normalize>=2&&!done?'<div class="actions">'+button('assist-norm',L('Reveal worked values (marked assisted)','Mostrar resultados (marcado asistido)'),'ghost')+'</div>':'')+'<div class="actions">'+button('previous',L('Back','Atrás'),'secondary')+button('next',L('See all 20 project scores','Ver las 20 puntuaciones'),done?'':'secondary')+'</div></section>'}
function results(){if(!weights||!S.checks.ahp||!S.checks.normalize||!S.checks.classify)return '<section class="card"><h2>'+L('Complete the checked calculations first','Completa primero los cálculos verificados')+'</h2><p>'+L('Classify criteria, verify a coherent AHP matrix, and complete the benefit/cost exercises.','Clasifica criterios, verifica AHP y completa los ejercicios de beneficio/costo.')+'</p>'+button('go-first',L('Go to Step 1','Ir al Paso 1'))+'</section>';
 const p=scenario.projects[scenario.focusIndex],row=mcda.rows[scenario.focusIndex];const top=mcda.ranking.slice(0,3);const detail=E.CRITERIA.map((c,j)=>'<tr><td>'+q(S.lang==='es'?c.es:c.en)+'</td><td>'+fmtRaw(c.key,p.values[c.key])+'</td><td>'+f(row.norm[j],4)+'</td><td>'+f(weights.criterionWeights[j],6)+'</td><td><strong>'+f(row.contribution[j],6)+'</strong></td></tr>').join('');const ranking=mcda.ranking.map((r,i)=>'<tr '+(i<3?'class="accent"':'')+'><td>'+String(i+1)+'</td><td>'+r.project.code+'</td><td>'+q(S.lang==='es'?r.project.titleEs:r.project.titleEn)+'</td><td><strong>'+f(r.score,6)+'</strong></td></tr>').join('');
 return '<section class="card">'+sectionTitle(4,L('Rank and interpret all 20 projects','Clasifica e interpreta los 20 proyectos'),L('10 minutes · Weighted scoring from your 8 criterion weights','10 minutos · Ponderación de 8 criterios'))+'<div class="notice">S<sub>i</sub> = Σ<sub>j=1</sub><sup>8</sup> w<sub>j</sub>n<sub>ij</sub> · '+L('Each score is a preference index, not profit or success probability.','Cada resultado es un índice de preferencia, no utilidad ni probabilidad de éxito.')+'</div><div class="grid three">'+top.map((r,i)=>'<div class="kpi"><div class="caption">'+L('Rank','Puesto')+' '+(i+1)+'</div><div class="value">'+r.project.code+'</div><strong>'+f(r.score,6)+'</strong></div>').join('')+'</div><div class="grid two"><div><h3>'+L('Complete ranking','Clasificación completa')+'</h3><div class="table-wrap" style="max-height:440px"><table><thead><tr><th>#</th><th>ID</th><th>'+L('Project','Proyecto')+'</th><th>'+L('Score','Puntuación')+'</th></tr></thead><tbody>'+ranking+'</tbody></table></div></div><div><h3>'+L('Audit trail for '+p.code,'Traza de cálculo para '+p.code)+'</h3><div class="table-wrap" style="max-height:440px"><table><thead><tr><th>'+L('Criterion','Criterio')+'</th><th>Raw</th><th>n</th><th>w</th><th>w×n</th></tr></thead><tbody>'+detail+'</tbody><tfoot><tr><th>'+L('Total','Total')+'</th><th></th><th></th><th></th><th>'+f(row.score,6)+'</th></tr></tfoot></table></div><p class="small subtle">'+L('Weights and data come from your scenario. Unlike the instructor example, your best project need not be P07 or P19.','Los pesos y datos provienen de tu escenario; el mejor proyecto no tiene que ser P07 ni P19.')+'</p></div></div><div class="actions">'+button('previous',L('Back','Atrás'),'secondary')+button('next',L('Prepare results report','Preparar reporte de resultados'))+'</div></section>'}
function wordCount(s){return String(s||'').trim().split(/\s+/).filter(Boolean).length}
function report(){const a=weights,m=mcda,focus=scenario.projects[scenario.focusIndex],r=m.rows[scenario.focusIndex];const reportLines=[L('INDUSTRIAL PROJECT DECISION LAB — AHP + MCDA','LABORATORIO DE DECISIONES INDUSTRIALES — AHP + MCDA'), 'Scenario: '+scenario.code+' | Dataset signature: '+scenario.dataSignature, 'Context: '+(S.lang==='es'?scenario.context.es:scenario.context.en),'AHP judgments (V/C, V/F, C/F): '+S.judgments.join(', '),'Group weights (Value, Customer, Feasibility): '+a.weights.map(x=>f(x*100,4)+'%').join('; '),'CI: '+f(a.CI,7)+'; CR: '+f(a.CRpct,4)+'%; RI: 0.58','Manual project: '+focus.code,'Productivity n: '+f(r.norm[0],6)+'; contribution: '+f(r.contribution[0],6),'Duration n: '+f(r.norm[5],6)+'; contribution: '+f(r.contribution[5],6),'Top 5 MCDA: '+m.ranking.slice(0,5).map((x,i)=>(i+1)+'. '+x.project.code+' ('+f(x.score,6)+')').join('; '),'Chosen project: '+S.decision,'Recommendation: '+S.rationale,'Limitation: '+S.limitation,'Work status: '+(S.assisted.length?'ASSISTED ['+S.assisted.join(', ')+']':'independently verified')];return reportLines.join('\n')}
function finish(){if(!weights||!S.checks.classify||!S.checks.ahp||!S.checks.normalize)return '<section class="card"><h2>'+L('Complete your learning checks before reporting','Completa las verificaciones primero')+'</h2>'+button('go-first',L('Return to checks','Volver a las verificaciones'))+'</section>';
const wc=wordCount(S.rationale+' '+S.limitation),ready=S.decision&&wc>=100&&wc<=150;const select='<option value="">'+L('Select project','Seleccionar proyecto')+'</option>'+mcda.ranking.map(r=>'<option value="'+r.project.code+'" '+(S.decision===r.project.code?'selected':'')+'>'+r.project.code+' — '+q(S.lang==='es'?r.project.titleEs:r.project.titleEn)+'</option>').join('');
return '<section class="card">'+sectionTitle(5,L('Recommend one project and submit','Recomienda un proyecto y entrega'),L('10 minutes · Personal recommendation · Copyable results report','10 minutos · Recomendación personal · Reporte para copiar o descargar'))+'<div class="grid two"><div><div class="field"><label for="decision">'+L('Project you would authorize first','Proyecto que autorizarías primero')+'</label><select id="decision" data-field="decision">'+select+'</select></div><div class="field"><label for="rationale">'+L('Recommendation with numerical evidence','Recomendación con evidencia numérica')+'</label><textarea id="rationale" data-field="rationale" rows="6" placeholder="'+L('Compare normalized scores, AHP weights, and tradeoffs; you may disagree with the automatic rank if justified.','Compara resultados normalizados, pesos AHP y compensaciones; puedes disentir del ranking si lo justificas.')+'">'+q(S.rationale)+'</textarea></div><div class="field"><label for="limitation">'+L('One limitation or verification needed','Una limitación o verificación necesaria')+'</label><textarea id="limitation" data-field="limitation" rows="3" placeholder="'+L('Example: financial index definitions and staffing assumptions need confirmation.','Ejemplo: se deben confirmar los índices financieros y la disponibilidad del personal.')+'">'+q(S.limitation)+'</textarea><div id="wordcount" class="wordcount">'+wc+' '+L('words · Target 100–150 total','palabras · Objetivo 100–150 en total')+'</div></div></div><div><h3>'+L('Reproducible results for your instructor','Resultados reproducibles para tu docente')+'</h3><div class="notice"><p>'+L('The results report records your scenario ID, dataset signature, AHP judgments, weights, consistency check, worked calculations, ranking and recommendation.','El reporte registra tu código, la firma del conjunto de datos, los juicios AHP, pesos, consistencia, cálculos, clasificación y recomendación.')+'</p><p>'+L('Copy the report into your learning platform or download it as a text file. You can reopen this activity with your assigned code to reproduce the original project data.','Copia el reporte en tu plataforma educativa o descárgalo como archivo de texto. Puedes volver a abrir la actividad con el código asignado para reproducir los datos originales.')+'</p></div></div></div><div class="actions">'+button('generate-report',L('Generate submission','Generar entrega'),ready?'':'secondary')+button('previous',L('Back','Atrás'),'secondary')+'</div>'+(S.reportVisible?'<div class="notice '+(ready?'success':'warn')+'">'+(ready?L('Report ready to submit','Reporte listo para entregar'):L('Draft only: select a project and write 100–150 words across the two fields.','Solo borrador: elige un proyecto y escribe 100–150 palabras entre ambos campos.'))+'</div><pre class="summaryreport" id="summaryreport">'+q(report())+'</pre><div class="actions">'+button('copy-report',L('Copy results report','Copiar reporte de resultados'),ready?'':'secondary')+button('download-report',L('Download results .txt','Descargar resultados .txt'),'secondary')+'</div>':'')+'</section>'}
function render(){scenario=S.started?E.createScenario(S.code):null;if(S.started&&S.judgments.every(x=>Number.isFinite(E.parsePair(x)))){weights=E.ahpFromJudgments(S.judgments);mcda=E.mcda(scenario,weights)}else{weights=null;mcda=null}const parts=[L('Classify','Clasificar'), 'AHP',L('Normalize','Normalizar'),L('Rank','Clasificar proyectos'),L('Report','Informe')];const header='<div class="mast"><div class="shell"><div class="mastline"><div><div class="eyebrow">'+L('Industrial Project Decision Lab','Laboratorio de Decisiones Industriales')+'</div><h1>'+L('AHP + MCDA project prioritization','Priorización de proyectos AHP + MCDA')+'</h1><p>'+L('Build a transparent preference model and rank 20 synthetic industrial projects. Individual 60-minute activity.','Construye un modelo de preferencias transparente y clasifica 20 proyectos industriales sintéticos. Actividad individual de 60 minutos.')+'</p><div class="authorline">'+L('Created by','Desarrollado por')+' <strong>Boris Herbas</strong></div></div><button class="lang-button" data-action="language">'+(S.lang==='en'?'Español':'English')+'</button></div></div></div>';
 const navBar=S.started?'<div class="topline"><span class="tag">'+q(S.code)+' · '+q(S.lang==='es'?scenario.context.es:scenario.context.en)+'</span><span class="tag orange">'+L('Dataset signature','Firma de datos')+': '+scenario.dataSignature+'</span><span class="small muted-txt">'+L('Autosave where supported. Download your results report.','Autoguardado si es compatible. Descarga tu reporte de resultados.')+'</span></div><div class="stepnav">'+parts.map((s,i)=>'<button type="button" data-action="nav" data-index="'+i+'" class="'+(S.stage===i?'active':((i===0&&S.checks.classify)||(i===1&&S.checks.ahp)||(i===2&&S.checks.normalize)?'done':''))+'"><span class="stepnum">'+(i+1)+'</span>'+s+'</button>').join('')+'</div><div class="progressbar"><div style="width:'+(Object.values(S.checks).filter(Boolean).length/3*100)+'%"></div></div>':'';
 const body=!S.started?intro():[classify,AHP,norm,results,finish][S.stage]();const footer='<footer class="footer"><span>© Boris Herbas · '+L('Self-contained; no external data transfers','Autónomo; no transmite datos externos')+'</span><span>'+L('Synthetic case: not actual business data','Caso sintético: no son datos empresariales reales')+'</span></footer>';document.getElementById('app').innerHTML=header+'<main class="shell">'+navBar+feedback()+body+footer+'</main>';
}
function checkClassify(){S.attempts.classify++;const errors=E.CRITERIA.filter(k=>S.dir[k.key]!==String(k.dir));if(errors.length){S.checks.classify=false;stat(L('Check these criteria: ','Revisa estos criterios: ')+errors.map(k=>(S.lang==='es'?k.es:k.en)).join(', ')+'.', 'bad')}else{S.checks.classify=true;stat(L('All eight benefit/cost directions are correct.','Las ocho clasificaciones beneficio/costo son correctas.'),'good')}}
function checkAHP(assisted=false){S.attempts.ahp++;if(!S.judgments.every(x=>Number.isFinite(E.parsePair(x))))return stat(L('Enter all three comparison values.','Introduce los tres juicios.'),'bad');const a=E.ahpFromJudgments(S.judgments);if(!a.passed){S.checks.ahp=false;return stat(L('Consistency ratio is '+f(a.CRpct,2)+'%; it exceeds the 10% consistency threshold. Revise pairwise comparisons rather than forcing a result.','El CR es '+f(a.CRpct,2)+'%; supera 10%. Revisa los juicios en lugar de forzar un resultado.'),'bad');}const expected={gm:a.gm[0],weight:a.weights[0]*100,ci:a.CI,cr:a.CRpct};const tolerance={gm:.015,weight:.25,ci:.001,cr:.25};let wrong=[];for(let k of Object.keys(expected)){const v=E.safeNumber(S.answers[k]);const ok=Number.isFinite(v)&&Math.abs(v-expected[k])<=tolerance[k] || (k==='weight'&&Math.abs(v*100-expected[k])<=tolerance[k]) || (k==='cr'&&Math.abs(v*100-expected[k])<=tolerance[k]);if(!ok)wrong.push(k.toUpperCase());}if(wrong.length&&!assisted){S.checks.ahp=false;return stat(L('Recheck: ','Revisar: ')+wrong.join(', ')+'. '+L('Enter the weight and CR as percentages; use the geometric mean, not arithmetic averaging.','Introduce el peso y CR en porcentaje; usa media geométrica, no promedio aritmético.'),'bad');}S.checks.ahp=true;if(assisted){S.assisted.push('ahp');S.answers={...S.answers,gm:f(a.gm[0],6),weight:f(a.weights[0]*100,5),ci:f(a.CI,7),cr:f(a.CRpct,5)};}stat(L('AHP verified. Your group weights are ready for weighted scoring.','AHP verificado. Tus pesos están listos para la puntuación ponderada.'),'good')}
function checkNorm(assisted=false){S.attempts.normalize++;if(!weights||!S.checks.ahp)return stat(L('Complete AHP first.','Completa AHP primero.'),'bad');const p=scenario.projects[scenario.focusIndex],cols=E.columnData(scenario),np=(p.values.productivity-cols[0].min)/(cols[0].max-cols[0].min),nd=(cols[5].max-p.values.duration)/(cols[5].max-cols[5].min),exp={np,nd,cp:np*weights.criterionWeights[0],cd:nd*weights.criterionWeights[5]};let wrong=[];for(let k of Object.keys(exp)){const v=E.safeNumber(S.answers[k]);if(!Number.isFinite(v)||Math.abs(v-exp[k])>.0015)wrong.push(k.toUpperCase());}if(wrong.length&&!assisted){S.checks.normalize=false;return stat(L('Please revisit: ','Revisa: ')+wrong.join(', ')+'. '+L('For a cost criterion, smaller raw values produce higher normalized scores.','En un criterio de costo, un valor bruto menor produce una puntuación normalizada mayor.'),'bad');}S.checks.normalize=true;if(assisted){S.assisted.push('normalize');Object.keys(exp).forEach(k=>S.answers[k]=f(exp[k],6));}stat(L('Both normalized values and weighted contributions are verified.','Se verificaron las dos normalizaciones y sus contribuciones.'),'good')}
async function copy(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return true;}}catch(e){}let box=document.createElement('textarea');box.value=value;box.style.position='fixed';box.style.left='-10000px';document.body.appendChild(box);box.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}box.remove();return ok;}
function download(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function handle(action,el){if(action==='language'){S.lang=S.lang==='en'?'es':'en';save();render();return}if(action==='start'){const code=E.normalizeCode(document.getElementById('scenario-entry')?.value);if(!code)return stat(L('Enter a valid scenario ID such as IE-007 (IE-001 to IE-999).','Introduce un código válido como IE-007 (IE-001 a IE-999).'),'bad');S={...empty(),lang:S.lang,started:true,code};scenario=E.createScenario(code);save();render();return}if(action==='nav'){nav(Number(el.dataset.index));return}if(action==='next'){if(S.stage===0&&!S.checks.classify)return stat(L('Verify all eight directions before continuing.','Verifica las ocho clasificaciones antes de continuar.'),'bad');if(S.stage===1&&!S.checks.ahp)return stat(L('Verify a consistent AHP matrix first.','Verifica una matriz AHP coherente primero.'),'bad');if(S.stage===2&&!S.checks.normalize)return stat(L('Verify the four normalization exercises first.','Verifica los cuatro cálculos primero.'),'bad');next();return}if(action==='previous'){nav(S.stage-1);return}if(action==='go-ahp'){nav(1);return}if(action==='go-first'){nav(0);return}if(action==='check-classify'){checkClassify();return}if(action==='check-ahp'){checkAHP();return}if(action==='check-norm'){checkNorm();return}if(action==='assist-ahp'){checkAHP(true);return}if(action==='assist-norm'){checkNorm(true);return}if(action==='generate-report'){S.reportVisible=true;stat(L('A report draft is displayed below. Verify the word count and all fields before submitting.','Se muestra el borrador del informe. Verifica las palabras y campos antes de enviar.'),'info');return}if(action==='copy-report'){copy(report()).then(ok=>stat(ok?L('Report copied. Paste it in your learning platform or document.','Reporte copiado. Pégalo en tu plataforma educativa o documento.'):L('Automatic copy unavailable; select the report text manually.','Copia automática no disponible; selecciona el texto manualmente.'),ok?'good':'bad'));return}if(action==='download-report'){download('AHP_MCDA_Report_'+S.code+'.txt',report());return}}
document.getElementById('app').addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t)handle(t.dataset.action,t)});
document.getElementById('app').addEventListener('change',e=>{const t=e.target;if(t.dataset.direction){S.dir[t.dataset.direction]=t.value;S.checks.classify=false;S.reportVisible=false;save();return}if(t.dataset.judge!==undefined){S.judgments[Number(t.dataset.judge)]=t.value;clearAfterAHP();S.reportVisible=false;save();render();return}if(t.dataset.field){S[t.dataset.field]=t.value;S.reportVisible=false;save();render();return}});
document.getElementById('app').addEventListener('input',e=>{const t=e.target;if(t.dataset.answer){S.answers[t.dataset.answer]=t.value;if(S.stage===1)S.checks.ahp=false;if(S.stage===2)S.checks.normalize=false;save();}if(t.dataset.field){S[t.dataset.field]=t.value;S.reportVisible=false;save();if(t.id==='rationale'||t.id==='limitation'){const c=document.getElementById('wordcount');if(c)c.textContent=wordCount(S.rationale+' '+S.limitation)+' '+L('words · Target 100–150 total','palabras · Objetivo 100–150 en total');}}});
render();
})();
